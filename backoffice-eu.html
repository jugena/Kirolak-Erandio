<!DOCTYPE html>
<html lang="eu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berrien Backofficea | Erandio Kirolak</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Include Quill for Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        .backoffice-header {
            background-color: #333;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .backoffice-header h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .backoffice-header a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .backoffice-header a:hover {
            color: var(--secondary-color);
        }
    </style>
</head>

<body style="background-color: #f0f2f5;">
    <!-- Login Overlay -->
    <div id="login-overlay"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary-color); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column;">
        <div
            style="background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center; max-width: 400px; width: 90%;">
            <div style="margin-bottom: 1.5rem;">
                <img src="irudiak/logo.png" alt="Erandio Kirolak" style="height: 60px;">
            </div>
            <h2 style="color: var(--primary-color); margin-bottom: 1.5rem; font-family: 'Inter', sans-serif;">Sarrera Mugatua</h2>
            <input type="password" id="login-password" placeholder="Sartzeko pasahitza"
                style="width: 100%; padding: 1rem; border: 2px solid #e0e0e0; border-radius: 10px; margin-bottom: 1.5rem; font-size: 1rem; font-family: 'Inter', sans-serif; box-sizing: border-box;">
            <button onclick="checkPassword()" class="btn"
                style="width: 100%; padding: 1rem; font-size: 1.1rem; border: none; cursor: pointer;">Sartu</button>
            <p id="login-error"
                style="color: #e74c3c; margin-top: 1rem; display: none; font-size: 0.9rem; font-weight: 600;">Pasahitz okerra</p>
            <div style="margin-top: 1.5rem;">
                <a href="index-eu.html" style="color: #7f8c8d; text-decoration: none; font-size: 0.9rem;">Webgunera itzuli</a>
            </div>
        </div>
    </div>
    <script>
        function checkPassword() {
            if (document.getElementById('login-password').value === "erandio2026") {
                document.getElementById('login-overlay').style.display = 'none';
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('login-password').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    checkPassword();
                }
            });
            document.getElementById('login-password').focus();
        });
    </script>

    <div class="backoffice-header">
        <h1><i class="fas fa-tools"></i> Kudeaketa Panela (Backoffice)</h1>
        <div style="display: flex; gap: 20px; align-items: center;">
            <div class="lang-switcher"
                style="background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px;">
                <a href="backoffice-eu.html" style="font-weight: bold; color: var(--secondary-color);">EU</a>
                <span style="color: #666; margin: 0 5px;">|</span>
                <a href="backoffice.html" style="color: white; text-decoration: none;">ES</a>
            </div>
            <a href="index-eu.html"><i class="fas fa-arrow-left"></i> Webgunera itzuli</a>
        </div>
    </div>

    <main>
        <div class="card" style="width: 100%; margin: 0 auto; margin-top: 2rem;">
            <h2
                style="color: var(--primary-color); margin-bottom: 1.5rem; border-bottom: 2px solid #eee; padding-bottom: 0.5rem;">
                Berri berria argitaratu</h2>

            <form id="news-form">
                <input type="hidden" id="news-id">

                <!-- Parte Superior: Campos Comunes -->
                <div style="background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border: 1px solid #eee; margin-bottom: 2rem;">
                    <h3 style="margin-bottom: 1.5rem; color: var(--primary-color); font-size: 1.1rem; border-bottom: 1px solid #ddd; padding-bottom: 0.5rem;">
                        <i class="fas fa-cog"></i> Konfigurazio Orokorra (ES/EU-rako berdina)
                    </h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                        <div class="form-group">
                            <label for="news-date">Ikus-data (ES/EU)</label>
                            <input type="date" id="news-date" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="news-publish-date">Argitaratze-data (Automatikoa)</label>
                            <input type="date" id="news-publish-date" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="news-expiry-date">Iraungitze-data (Desagertu)</label>
                            <input type="date" id="news-expiry-date" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="news-img">URL Irudi Nagusia</label>
                            <input type="text" id="news-img" class="form-control" placeholder="https://ejemplo.com/imagen.jpg">
                        </div>
                    </div>
                    <div id="news-img-preview" style="height: 150px; width: 100%; background-size: contain; background-position: center; background-repeat: no-repeat; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #ddd; background-color: #fff;"></div>
                </div>

                <!-- Parte Inferior: Dos Columnas por Idioma -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                    <!-- Columna Castellano -->
                    <div style="background: white; padding: 1.5rem; border-radius: 12px; border: 1px solid #eee;">
                        <h3 style="margin-bottom: 1.5rem; color: #666; border-bottom: 1px solid #eee; padding-bottom: 0.5rem;">Gaztelaniazko bertsioa</h3>
                        <div class="form-group">
                            <label for="news-title-es">Título (ES)</label>
                            <input type="text" id="news-title-es" class="form-control" placeholder="Título en castellano" required>
                        </div>
                        <div class="form-group">
                            <label for="news-summary-es">Resumen / Entradilla (ES)</label>
                            <textarea id="news-summary-es" class="form-control" style="height: 80px;" placeholder="Breve resumen para la portada..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Contenido Detallado (ES)</label>
                            <div id="editor-es" style="height: 300px;"></div>
                            <textarea id="html-es" class="form-control" style="height: 300px; display: none; font-family: monospace;"></textarea>
                        </div>
                    </div>

                    <!-- Columna Euskera -->
                    <div style="background: white; padding: 1.5rem; border-radius: 12px; border: 1px solid #eee;">
                        <h3 style="margin-bottom: 1.5rem; color: #666; border-bottom: 1px solid #eee; padding-bottom: 0.5rem;">Euskarazko bertsioa</h3>
                        <div class="form-group">
                            <label for="news-title-eu">Izenburua (EU)</label>
                            <input type="text" id="news-title-eu" class="form-control" placeholder="Izenburua euskaraz" required>
                        </div>
                        <div class="form-group">
                            <label for="news-summary-eu">Laburpena (EU)</label>
                            <textarea id="news-summary-eu" class="form-control" style="height: 80px;" placeholder="Azalpen laburra azalarentzat..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Eduki Zehatza (EU)</label>
                            <div id="editor-eu" style="height: 300px;"></div>
                            <textarea id="html-eu" class="form-control" style="height: 300px; display: none; font-family: monospace;"></textarea>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 1rem; justify-content: center;">
                    <button type="button" class="btn btn-admin-outline btn-small" onclick="translateContent('es', 'eu')">
                        <i class="fas fa-language"></i> Traducir Todo a Euskera
                    </button>
                    <button type="button" class="btn btn-admin-outline btn-small" onclick="translateContent('eu', 'es')">
                        <i class="fas fa-language"></i> Traducir Todo a Castellano
                    </button>
                    <button type="button" class="btn btn-admin-outline btn-small" onclick="toggleHtml('es'); toggleHtml('eu');">
                        <i class="fas fa-code"></i> Alternar Vista HTML
                    </button>
                </div>

                <div
                    style="margin-top: 1.5rem; display: flex; gap: 2rem; background: #fff; padding: 1rem; border-radius: var(--border-radius); border: 1px solid #ddd;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="news-on-home" style="width: 20px; height: 20px; cursor: pointer;">
                        <label for="news-on-home" style="font-weight: bold; cursor: pointer;">Hasierako karruselan
                            argitaratu</label>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="news-disabled" style="width: 20px; height: 20px; cursor: pointer;">
                        <label for="news-disabled" style="font-weight: bold; cursor: pointer; color: #d63031;">Berria
                            desgaitu (Ez da webgunean agertuko)</label>
                    </div>
                </div>

                <div style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1.5rem; text-align: center;">
                    <button type="submit" id="submit-btn" class="btn"><i class="fas fa-save"></i> Berria
                        argitaratu</button>
                    <button type="button" id="cancel-edit" class="btn btn-admin-outline"
                        style="display: none; margin-left:1rem;">Edizioa bertan behera utzi</button>
                </div>
            </form>
        </div>

        <div class="card" style="width: 100%; margin: 2rem auto;">
            <h2
                style="color: var(--primary-color); margin-bottom: 1.5rem; border-bottom: 2px solid #eee; padding-bottom: 0.5rem;">
                Argitaratutako berrien kudeaketa</h2>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>Izenburua</th>
                        <th width="300">Data</th>
                        <th width="100" style="text-align: center;">Home-n</th>
                        <th width="100" style="text-align: center;">Ezkutatu</th>
                        <th width="160" style="text-align: center;">Ekintzak</th>
                    </tr>
                </thead>
                <tbody id="news-table-body">
                    <!-- Javascript populates this via LocalStorage -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Include Quill library -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="script.js"></script>
</body>

</html>
